services:
  postgres:
    image: postgres:16
    container_name: fitness-postgres
    env_file: .env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fitness-net

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - fitness-net

  zookeeper:
    image: wurstmeister/zookeeper:latest
    container_name: zookeeper
    platform: linux/amd64
    ports:
      - "2181:2181"
    networks:
      - fitness-net

  kafka:
    image: wurstmeister/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENER_NAME: INSIDE
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_CONFLUENT_SUPPORT_METRICS_ENABLE: "false"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    depends_on:
      - zookeeper
    networks:
      - fitness-net

  auth-service:
    build: ../auth-service
    container_name: fitness-auth-service
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/reg_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    depends_on:
      - postgres
    networks:
      - fitness-net

  training-service:
    build: ../training-service
    container_name: fitness-training-service
    ports:
      - "8081:8081"
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/training_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    depends_on:
      - postgres
      - kafka
    networks:
      - fitness-net

  gamification-service:
    build: ../gamification-service
    container_name: fitness-gamification-service
    ports:
      - "8082:8082"
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gamification_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    depends_on:
      - postgres
      - kafka
    networks:
      - fitness-net

  challenge-service:
    build: ../challenge-service
    container_name: fitness-challenge-service
    ports:
      - "8083:8083"
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/challenge_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    depends_on:
      - postgres
      - kafka
    networks:
      - fitness-net

  notification-service:
    build: ../notification_service
    container_name: fitness-notification-service
    ports:
      - "8084:8084"
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/notification_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    depends_on:
      - postgres
      - kafka
    networks:
      - fitness-net

  payment-service:
    build: ../payment-service
    container_name: fitness-payment-service
    ports:
      - "8085:8085"
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    depends_on:
      - postgres
      - redis
      - kafka
    networks:
      - fitness-net

  ai-service:
    build: ../ai-service
    container_name: fitness-ai-service
    ports:
      - "8086:8086"
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ai_db
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9093
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}
    depends_on:
      - postgres
      - kafka
    networks:
      - fitness-net

volumes:
  postgres_data:

networks:
  fitness-net:
    driver: bridge