spring.application.name=ai-service
server.port=8086
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.url=jdbc:postgresql://localhost:5432/ai_db
spring.datasource.username=Arm
spring.datasource.password=1234

#OpenAI
openai.api.key=${OPENAI_API_KEY}
openai.model=${OPENAI_MODEL:gpt-5.2}
openai.base-url=https://api.openai.com/v1/chat/completions

#Kafka initial config
spring.kafka.producer.bootstrap-servers=localhost:9092

#Kafka Producer Configuration
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false

#JWT and Security
jwt.secret=super_secret_key_123456_super_secret_key
jwt.expirationMs=86400000

#EurekaService
#eureka.client.service-url.defaultZone: http://localhost:8755/eureka
#eureka.client.register-with-eureka=true
#eureka.client.fetch-registry=true
#eureka.instance.prefer-ip-address=true
#eureka.instance.hostname=localhost
eureka.client.enabled=false
spring.cloud.discovery.enabled=false